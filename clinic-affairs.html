<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>似錦牙醫・診所事務</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--text:#1c2733;--mute:#5f6e7c;--line:#d5dde5;--acc:#2f7f9d;--tint:#e3f1f7;--ok:#2f8a4c;--okbg:#e2f3e7;--warn:#a8650f;--warnbg:#fbefdb;--bad:#cc4457;--badbg:#f9e3e6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11181e;--card:#1a232b;--text:#e6edf2;--mute:#9aa9b6;--line:#2f3d49;--acc:#6bb8d6;--tint:#1d3340;--ok:#6fcf8c;--okbg:#1b3324;--warn:#e8a950;--warnbg:#3a2c14;--bad:#ef7788;--badbg:#3c1f26}}
:root[data-theme="dark"]{--bg:#11181e;--card:#1a232b;--text:#e6edf2;--mute:#9aa9b6;--line:#2f3d49;--acc:#6bb8d6;--tint:#1d3340;--ok:#6fcf8c;--okbg:#1b3324;--warn:#e8a950;--warnbg:#3a2c14;--bad:#ef7788;--badbg:#3c1f26}
*{box-sizing:border-box}
html{font-size:112.5%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:18px 16px 48px}
.brand{display:flex;justify-content:center;margin:0 0 6px}
.brand img{width:170px;max-width:55%;height:auto;border-radius:18px;background:#fefefd}
h1{font-size:1.4rem;margin:0 0 2px;color:var(--acc);text-align:center}
.sub{text-align:center}
h2{font-size:1.05rem;margin:14px 0 8px}
.sub{color:var(--mute);font-size:.85rem;margin:0 0 14px}
.who{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:.92rem}
.who span{width:5.5em;flex:none}
.who input{flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:16px}
.tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{flex:1;min-width:90px;padding:9px 8px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:.85rem;cursor:pointer;line-height:1.3}
.tabs button.on{border-color:var(--acc);background:var(--tint);color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0 0 10px}
.itm{padding:7px 0}
.itm+.itm{border-top:1px dashed var(--line)}
.ih{display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
.bt{display:flex}
.bt button{width:32px;height:32px;margin-left:5px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--text);font-size:1rem;cursor:pointer;line-height:1}
.bt button:disabled{opacity:.3;cursor:default}
.en{display:flex;align-items:center;gap:6px;margin-top:5px}
.ix{width:1.3em;flex:none;color:var(--mute);font-size:.78rem;text-align:center}
.itm input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--text);font:inherit;font-size:16px}
.itm input.a{text-align:right}
.itm input.n{font-size:14px}
.st{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:700;font-size:.92rem}
.ar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ar button{padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit;font-size:.88rem;cursor:pointer}
.ar button.add{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.flt{display:flex;gap:5px;margin:10px 0 8px;flex-wrap:wrap}
.flt button{padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:.8rem;cursor:pointer}
.flt button.on{border-color:var(--acc);background:var(--tint);color:var(--acc);font-weight:700}
.box{border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:10px}
.box.warn{background:var(--warnbg);color:var(--warn)}
.box.sum{background:var(--tint);color:var(--text)}
.note{color:var(--mute);font-size:.76rem;margin-top:20px}
#login-box{max-width:400px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
#login-box h2{margin:0 0 16px;font-size:1.2rem;text-align:center}
#login-box input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:16px;margin-bottom:12px}
#login-box button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-size:1rem;font-weight:700;cursor:pointer}
#login-box button:hover{opacity:.9}
#login-box .error{color:var(--bad);font-size:.85rem;margin-top:-8px;margin-bottom:12px}
.logout-btn{position:fixed;top:12px;right:12px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mute);font-size:.85rem;cursor:pointer}
#app{display:none}
#app.show{display:block}
</style>
</head>
<body>
<div id="login-box">
<h2>登入</h2>
<input type="password" id="pwd" placeholder="請輸入密碼" autocomplete="current-password">
<div class="error" id="err" style="display:none"></div>
<button onclick="doLogin()">登入</button>
</div>
<button class="logout-btn" id="logout-btn" style="display:none" onclick="doLogout()">登出</button>
<main id="app">
<div class="brand"><img src="logo-sijin.jpg" alt="似錦牙醫 SI JIN DENTAL CLINIC" width="640" height="640"></div>
<label class="who"><span>你的名字</span><input id="nick" placeholder="留言與新增時會顯示，例如：郭醫師" maxlength="20"></label>
<p id="stat">連線中…</p>
<div id="tabs"></div>
<div id="view"></div>
<p class="note">資料存在共用資料庫，所有人看到同一份並即時同步；兩人同時改同一筆時，以最後存入的為準。刪除後無法復原。</p>
</main>
<script src="sb-lite-auth.js"></script>
<script>
var SUPABASE_URL='https://uafwnkgkocvuaztuxowo.supabase.co';
var SUPABASE_ANON_KEY='sb_publishable_q6qRmnvKG5HGorjT1e4btA_MkFlEqYo';
var sb=null,sub=null,cid=null,catId=null,data={},nick='',CATS=[
{id:'payable',name:'應付帳款',desc:'還沒付的帳單、欠款'},
{id:'expense',name:'支出費用',desc:'已付款的開銷'},
{id:'income',name:'營收收入',desc:'診所的進帳'}
];
function stat(m){document.getElementById('stat').textContent=m;}
function renderTabs(){
var h='';
CATS.forEach(function(c){
var cls=c.id===catId?'on':'';
h+='<button class="'+cls+'" onclick="switchCat(\''+c.id+'\')">'+c.name+'<br><small>'+c.desc+'</small></button>';
});
document.getElementById('tabs').innerHTML=h;
}
function switchCat(id){catId=id;renderTabs();renderView();}
function renderView(){
if(!catId){document.getElementById('view').innerHTML='';return;}
var cat=CATS.find(function(c){return c.id===catId;});
var items=data[catId]||[];
var h='<div class="card"><h2>'+cat.name+'</h2>';
if(items.length===0){
h+='<p style="color:var(--mute);font-size:.88rem">尚無項目</p>';
}else{
items.forEach(function(it,idx){
h+='<div class="itm"><div class="ih"><span>'+it.name+'</span><div class="bt">';
h+='<button onclick="delItem('+idx+')" title="刪除">×</button>';
h+='</div></div>';
(it.entries||[]).forEach(function(e,ei){
h+='<div class="en"><span class="ix">'+(ei+1)+'</span>';
h+='<input type="text" class="n" value="'+(e.note||'')+'" onchange="updateEntry('+idx+','+ei+',\'note\',this.value)" placeholder="說明">';
h+='<input type="text" class="a" value="'+(e.amount||'')+'" onchange="updateEntry('+idx+','+ei+',\'amount\',this.value)" placeholder="金額">';
h+='</div>';
});
h+='</div>';
});
var tot=0;
items.forEach(function(it){
(it.entries||[]).forEach(function(e){
var v=parseFloat(e.amount)||0;
tot+=v;
});
});
h+='<div class="st"><span>總計</span><b>'+tot.toLocaleString('zh-TW')+'</b></div>';
}
h+='<div class="ar"><button class="add" onclick="addItem()">＋ 新增項目</button></div></div>';
document.getElementById('view').innerHTML=h;
}
function addItem(){
var name=prompt('項目名稱？');
if(!name)return;
var items=data[catId]||[];
items.push({name:name,entries:[{note:'',amount:''}],by:nick||'未具名',at:new Date().toISOString()});
data[catId]=items;
save();
}
function delItem(idx){
if(!confirm('確定刪除此項目？'))return;
var items=data[catId]||[];
items.splice(idx,1);
data[catId]=items;
save();
}
function updateEntry(idx,ei,field,val){
var items=data[catId]||[];
if(!items[idx])return;
if(!items[idx].entries[ei])items[idx].entries[ei]={};
items[idx].entries[ei][field]=val;
data[catId]=items;
save();
}
function save(){
if(!sb)return;
var key=catId;
sb.from('clinic_items').upsert({clinic_id:0,item_key:key,entries:data[catId]},{onConflict:'clinic_id,item_key'}).then(function(r){
if(r.error){stat('儲存失敗：'+r.error.message);}
});
}
function doLogin(){
var p=document.getElementById('pwd').value;
sb.auth.signInWithPassword({password:p}).then(function(r){
if(r.error){
document.getElementById('err').textContent=r.error.message||'密碼錯誤';
document.getElementById('err').style.display='block';
}else{
document.getElementById('login-box').style.display='none';
document.getElementById('logout-btn').style.display='block';
document.getElementById('app').className='show';
init();
}
});
}
function doLogout(){
sb.auth.signOut();
document.getElementById('login-box').style.display='block';
document.getElementById('logout-btn').style.display='none';
document.getElementById('app').className='';
if(sub){sb.removeChannel(sub);sub=null;}
}
async function init(){
try{
stat('載入資料中…');
var res=await sb.from('clinic_items').select('*').eq('clinic_id',0);
if(res.error){throw res.error;}
if(res.data&&res.data.length>0){
res.data.forEach(function(row){
if(row.item_key&&row.entries)data[row.item_key]=row.entries;
});
}
catId='payable';
renderTabs();
renderView();
stat('');
sub=sb.channel('db-changes').on('postgres_changes',{event:'*',schema:'public',table:'clinic_items'},function(p){
var k=p.new.item_key||p.old.item_key;
if(!k)return;
if(p.eventType==='DELETE'){
delete data[k];
}else if(p.new.entries){
data[k]=p.new.entries;
}
renderView();
}).subscribe();
}catch(e){
stat('載入失敗：'+(e.message||e));
}
}
sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
sb.auth.getSession().then(function(r){
if(r.data.session){
document.getElementById('login-box').style.display='none';
document.getElementById('logout-btn').style.display='block';
document.getElementById('app').className='show';
init();
}
});
try{
var stored=localStorage.getItem('clinic.nick');
if(stored)document.getElementById('nick').value=stored;
}catch(e){}
document.getElementById('nick').addEventListener('change',function(){
nick=this.value;
try{localStorage.setItem('clinic.nick',nick);}catch(e){}
});
</script>
</body>
</html>
