<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三井牙醫・三井美學牙醫｜資金與財產結算</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--text:#1d2b27;--mute:#5d6b66;--line:#cfd6d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--text:#e8efec;--mute:#9aa8a2;--line:#33403b}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--text:#e8efec;--mute:#9aa8a2;--line:#33403b}
body[data-clinic="0"]{--bg:#eef7ef;--acc:#4f9d69;--tint:#e0f0e4;--line:#c5dccb}
body[data-clinic="1"]{--bg:#f3eefa;--acc:#8a6bc4;--tint:#e8e0f5;--line:#d3c8e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-clinic="0"]{--bg:#13201a;--acc:#7bc795;--tint:#1c3326;--line:#2f4a3a}:root:not([data-theme="light"]) body[data-clinic="1"]{--bg:#1a1626;--acc:#b39ae0;--tint:#2a2140;--line:#43375e}}
:root[data-theme="dark"] body[data-clinic="0"]{--bg:#13201a;--acc:#7bc795;--tint:#1c3326;--line:#2f4a3a}
:root[data-theme="dark"] body[data-clinic="1"]{--bg:#1a1626;--acc:#b39ae0;--tint:#2a2140;--line:#43375e}
*{box-sizing:border-box}
html{font-size:112.5%}
body{margin:0;transition:background .25s;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.35rem;margin:0 0 4px}
.sub{color:var(--mute);font-size:.88rem;margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font:inherit;cursor:pointer;line-height:1.3}
.tabs button small{display:block;color:var(--mute);font-size:.75rem}
.tabs button.on{border-color:var(--text);font-weight:700}
.sh,.sw,.sumbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.sh h2,.sw h2,.sumbox h2{font-size:1rem;margin:0 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:.9rem}
.row span:first-child{width:9.5em;flex:none}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:#0f9d8a}
.row b{width:3.6em;text-align:right}
.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.ex .bar i{background:#d6455d;opacity:.6}
.ex .nm{text-decoration:line-through;color:var(--mute)}
.row em{font-style:normal;font-size:.7rem;padding:0 6px;border-radius:99px;background:#d6455d;color:#fff;margin-left:4px}
.sw{border-left:5px solid #d6455d;font-size:.9rem}
.sw p{margin:2px 0}
.u{margin-top:8px;color:var(--mute);font-size:.84rem}
.u b{color:var(--text)}
.sumbox{border-left:5px solid #4c9a3f}
.sr{display:flex;justify-content:space-between;padding:2px 0;font-size:.92rem}
.sr.k{font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.chk{margin-top:8px;padding:6px 10px;border-radius:8px;font-size:.88rem;font-weight:700}
.chk.ok{background:color-mix(in srgb,#4c9a3f 20%,var(--card))}
.chk.bad{background:color-mix(in srgb,#d6455d 18%,var(--card))}
.chk.nil{background:var(--bg);color:var(--mute);font-weight:400}
#login-box{max-width:400px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
#login-box h2{margin:0 0 16px;font-size:1.2rem;text-align:center}
#login-box input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:16px;margin-bottom:12px}
#login-box button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-size:1rem;font-weight:700;cursor:pointer}
#login-box button:hover{opacity:.9}
#login-box .error{color:#d6455d;font-size:.85rem;margin-top:-8px;margin-bottom:12px}
.logout-btn{position:fixed;top:12px;right:12px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mute);font-size:.85rem;cursor:pointer}
#app{display:none}
#app.show{display:block}
</style>
</head>
<body>
<div id="login-box">
<h2>登入</h2>
<input type="password" id="pwd" placeholder="請輸入密碼" autocomplete="current-password">
<div class="error" id="err" style="display:none"></div>
<button onclick="doLogin()">登入</button>
</div>
<button class="logout-btn" id="logout-btn" style="display:none" onclick="doLogout()">登出</button>
<main id="app">
<h1>資金與財產結算</h1>
<p class="sub">三井牙醫 / 三井美學牙醫</p>
<div class="tabs">
<button class="on" data-c="0" onclick="sw(0)">三井牙醫<br><small>郭維仁 40% / 陳宜廷 20%</small></button>
<button data-c="1" onclick="sw(1)">三井美學牙醫<br><small>郭維仁 70% / 陳宜廷 10%</small></button>
</div>
<div id="status" class="sub" style="text-align:center;margin:10px 0"></div>
<div id="list"></div>
<p class="note">數字存在共用儲存，有編輯權限的人都能修改；兩人同時改同一筆時，以最後存入的為準。僅為概念示意，不構成法律、稅務或財務建議。</p>
</main>
<script src="sb-lite-auth.js"></script>
<script>
var SUPABASE_URL = 'https://uafwnkgkocvuaztuxowo.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_q6qRmnvKG5HGorjT1e4btA_MkFlEqYo';
var N=['三井牙醫','三井美學牙醫'];
var S=[['郭維仁醫師',40,70],['陳宜廷醫師',20,10],['陳翊文醫師',15,7.5],['余珮璇醫師',10,5],['林佑都醫師',5,2.5],['林亭伃',10,5]];
var E=[[0,5],[1,2,3,4]];
var G=[
{n:'①',t:'現金與銀行',c:'#0f9d8a',u:'確認實際有多少錢',items:['銀行帳戶','現金','定存']},
{n:'②',t:'應收帳款',c:'#2f7f9d',u:'還沒收到的錢，例如保險公司還沒給付的部分負擔',items:['病患欠款','保險應收款','其他應收款']},
{n:'③',t:'固定資產',c:'#8a6bc4',u:'設備、裝潢等長期資產',items:['醫療設備','辦公設備','裝潢工程','其他固定資產']},
{n:'④',t:'應付帳款',c:'#d6455d',u:'還沒付的帳單',items:['供應商欠款','設備分期','租金','其他應付款']},
{n:'⑤',t:'費用與成本',c:'#e8a950',u:'日常營運支出',items:['藥材耗材','水電瓦斯','行政費用','行銷費用','其他費用']}
];
var cid=0,sbClient=null,data={},sub=null;
function stat(m){document.getElementById('status').textContent=m;}
function sw(c){
cid=c;
document.body.dataset.clinic=c;
document.querySelectorAll('.tabs button').forEach(function(b,i){b.className=i===c?'on':'';});
render();
}
function fmt(v){return (v||0).toLocaleString('zh-TW',{minimumFractionDigits:0,maximumFractionDigits:0});}
function render(){
var items=data[cid]||{};
var sh=G.filter(function(g){return g.n!=='④'&&g.n!=='⑤';});
var liab=G.find(function(g){return g.n==='④';});
var exp=G.find(function(g){return g.n==='⑤';});
var totA=0,totL=0,totE=0;
var h='<div class="sh"><h2>'+N[cid]+'・股東持分</h2>';
var max=0;
S.forEach(function(s){
var pct=(cid===0?s[1]:s[2]);
if(!pct)return;
var k='sh_'+s[0];
var v=parseFloat(items[k])||0;
totA+=v;
if(v>max)max=v;
});
S.forEach(function(s){
var pct=(cid===0?s[1]:s[2]);
if(!pct)return;
var k='sh_'+s[0];
var v=parseFloat(items[k])||0;
var w=max>0?(v/max*100):0;
h+='<div class="row"><span>'+s[0]+'</span><div class="bar"><i style="width:'+w+'%"></i></div><b>'+fmt(v)+'</b></div>';
});
h+='<div class="row tot"><span>總計</span><div class="bar"><i style="width:100%"></i></div><b>'+fmt(totA)+'</b></div></div>';
sh.forEach(function(g){
h+='<div class="sh"><h2>'+g.n+' '+g.t+'</h2>';
var gt=0,gm=0;
g.items.forEach(function(it){
var k=g.n+'_'+it;
var v=parseFloat(items[k])||0;
gt+=v;
if(v>gm)gm=v;
});
g.items.forEach(function(it){
var k=g.n+'_'+it;
var v=parseFloat(items[k])||0;
var w=gm>0?(v/gm*100):0;
h+='<div class="row"><span>'+it+'</span><div class="bar"><i style="width:'+w+'%"></i></div><b>'+fmt(v)+'</b></div>';
});
h+='<div class="row tot"><span>小計</span><div class="bar"><i style="width:100%"></i></div><b>'+fmt(gt)+'</b></div>';
h+='<p class="u"><b>用途：</b>'+g.u+'</p></div>';
});
h+='<div class="sw"><h2>'+liab.n+' '+liab.t+'</h2>';
liab.items.forEach(function(it){
var k=liab.n+'_'+it;
var v=parseFloat(items[k])||0;
totL+=v;
h+='<p>・'+it+'：'+fmt(v)+'</p>';
});
h+='<p style="font-weight:700;margin-top:6px">應付總額：'+fmt(totL)+'</p>';
h+='<p class="u"><b>用途：</b>'+liab.u+'</p></div>';
h+='<div class="sw"><h2>'+exp.n+' '+exp.t+'</h2>';
exp.items.forEach(function(it){
var k=exp.n+'_'+it;
var v=parseFloat(items[k])||0;
totE+=v;
h+='<p>・'+it+'：'+fmt(v)+'</p>';
});
h+='<p style="font-weight:700;margin-top:6px">費用總額：'+fmt(totE)+'</p>';
h+='<p class="u"><b>用途：</b>'+exp.u+'</p></div>';
var totAsset=0;
sh.forEach(function(g){
g.items.forEach(function(it){
var v=parseFloat(items[g.n+'_'+it])||0;
totAsset+=v;
});
});
var net=totAsset-totL;
var check=Math.abs(net-totA)<1;
h+='<div class="sumbox"><h2>結算檢查</h2>';
h+='<div class="sr"><span>資產總計</span><b>'+fmt(totAsset)+'</b></div>';
h+='<div class="sr"><span>負債總計</span><b>'+fmt(totL)+'</b></div>';
h+='<div class="sr k"><span>淨資產</span><b>'+fmt(net)+'</b></div>';
h+='<div class="sr"><span>股東持分</span><b>'+fmt(totA)+'</b></div>';
if(totAsset===0&&totL===0&&totA===0){
h+='<div class="chk nil">尚未填入任何數字</div>';
}else if(check){
h+='<div class="chk ok">✓ 數字平衡</div>';
}else{
h+='<div class="chk bad">⚠ 淨資產與股東持分不符，請檢查</div>';
}
h+='</div>';
document.getElementById('list').innerHTML=h;
}
function doLogin(){
var p=document.getElementById('pwd').value;
sbClient.auth.signInWithPassword({password:p}).then(function(r){
if(r.error){
document.getElementById('err').textContent=r.error.message||'密碼錯誤';
document.getElementById('err').style.display='block';
}else{
document.getElementById('login-box').style.display='none';
document.getElementById('logout-btn').style.display='block';
document.getElementById('app').className='show';
initSupabase();
}
});
}
function doLogout(){
sbClient.auth.signOut();
document.getElementById('login-box').style.display='block';
document.getElementById('logout-btn').style.display='none';
document.getElementById('app').className='';
if(sub){sbClient.removeChannel(sub);sub=null;}
}
async function initSupabase(){
try{
stat('共用儲存連線中…');
for(var i=0;i<2;i++){
var res=await sbClient.from('clinic_items').select('*').eq('clinic_id',i);
if(res.error){throw res.error;}
if(res.data&&res.data.length>0){
res.data.forEach(function(row){
if(!data[row.clinic_id])data[row.clinic_id]={};
if(row.entries)Object.assign(data[row.clinic_id],row.entries);
});
}
}
render();
stat('');
sub=sbClient.channel('db-changes')
.on('postgres_changes',{event:'*',schema:'public',table:'clinic_items'},function(payload){
var c=payload.new.clinic_id;
if(c===undefined)c=payload.old.clinic_id;
if(c===undefined)return;
if(!data[c])data[c]={};
if(payload.eventType==='DELETE'){
var k=payload.old.item_key;
if(k&&data[c][k]!==undefined)delete data[c][k];
}else if(payload.new.entries){
Object.assign(data[c],payload.new.entries);
}
if(c===cid)render();
})
.subscribe();
}catch(e){
stat('連線失敗：'+(e.message||e));
}
}
sbClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
sbClient.auth.getSession().then(function(r){
if(r.data.session){
document.getElementById('login-box').style.display='none';
document.getElementById('logout-btn').style.display='block';
document.getElementById('app').className='show';
initSupabase();
}
});
</script>
</body>
</html>
