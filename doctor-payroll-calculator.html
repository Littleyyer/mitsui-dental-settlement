<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>似錦牙醫｜醫師薪資查詢</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--text:#1d2b27;--mute:#5d6b66;--line:#cfd6d2;--acc:#4f9d69;--warn:#f59e0b;--bad:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--text:#e8efec;--mute:#9aa8a2;--line:#33403b}}
*{box-sizing:border-box}
html{font-size:112.5%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 8px;font-weight:600}
.sub{color:var(--mute);font-size:.85rem;margin:0 0 20px}
.card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.slider-section{margin-bottom:24px}
.slider-label{font-size:.9rem;color:var(--mute);margin-bottom:12px;display:block}
.slider-container{position:relative;overflow:hidden;touch-action:pan-y}
.slider-wrapper{display:flex;transition:transform 0.3s ease;gap:12px;padding:0 4px}
.slider-item{flex:0 0 auto;padding:12px 24px;background:var(--card);border:2px solid var(--line);border-radius:8px;cursor:pointer;user-select:none;transition:all 0.2s;white-space:nowrap;font-size:1rem}
.slider-item:hover{border-color:var(--acc);transform:translateY(-2px)}
.slider-item.active{background:var(--acc);color:white;border-color:var(--acc);font-weight:600}
.slider-nav{display:flex;gap:8px;justify-content:center;margin-top:12px}
.slider-nav button{background:var(--card);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.slider-nav button:hover{background:var(--acc);border-color:var(--acc);color:white}
.slider-nav button:disabled{opacity:0.3;cursor:not-allowed}

.salary-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:0.9rem}
.salary-table th,.salary-table td{padding:10px 12px;text-align:left;border:1px solid var(--line)}
.salary-table th{background:var(--acc);color:white;font-weight:600}
.salary-table td{background:var(--card)}
.salary-table tr.section-header td{background:var(--acc);color:white;font-weight:600;text-align:center}
.salary-table tr.highlight td{background:#fef3c7;font-weight:600}
.salary-table tr.final td{background:#d1fae5;font-weight:700;font-size:1.05rem}
.no-data{text-align:center;padding:40px 20px;color:var(--mute)}
.no-data h3{margin:0 0 8px;color:var(--text)}
.loading{text-align:center;padding:40px 20px;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>似錦牙醫｜醫師薪資查詢</h1>
<p class="sub">選擇月份和醫師查看薪資明細</p>

<div class="card">
<div class="slider-section">
<label class="slider-label">選擇月份</label>
<div class="slider-container" id="monthSlider">
<div class="slider-wrapper" id="monthWrapper"></div>
</div>
<div class="slider-nav">
<button id="monthPrev" onclick="slideMonth(-1)">◀</button>
<button id="monthNext" onclick="slideMonth(1)">▶</button>
</div>
</div>

<div class="slider-section">
<label class="slider-label">選擇醫師</label>
<div class="slider-container" id="doctorSlider">
<div class="slider-wrapper" id="doctorWrapper"></div>
</div>
<div class="slider-nav">
<button id="doctorPrev" onclick="slideDoctor(-1)">◀</button>
<button id="doctorNext" onclick="slideDoctor(1)">▶</button>
</div>
</div>
</div>

<div class="card" id="resultCard" style="display:none">
<div id="salaryData"></div>
</div>

<div class="loading" id="loading">請選擇月份和醫師</div>
</main>

<script src="sb-lite.js"></script>
<script>
const SUPABASE_URL='https://qhvmmgzdzacexvbxlhey.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodm1tZ3pkemFjZXh2YnhsaGV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzA0MzgzNjAsImV4cCI6MjA0NjAxNDM2MH0.Xp-rxSPW2Y5ZlDVPwh0Vo1Oc0lY4PrH_q6CZSXZQB1c';
const sb=new SBLite(SUPABASE_URL,SUPABASE_KEY);

const doctors=['郭維仁','余珮璇','林佑都','陳翊文','陳宜廷','程向正','李佶翰','何思穎','高方強','何昱璇','胡家瑄','李峻嘉','黃瀞儀','劉子綸','劉庭佑','秦御芬','陳厚錕'];
const months=['2026-09','2026-10','2026-11'];

let currentMonthIndex=months.length-1;
let currentDoctorIndex=0;
let monthStartIndex=0;
let doctorStartIndex=0;

function initSliders(){
const monthWrapper=document.getElementById('monthWrapper');
const doctorWrapper=document.getElementById('doctorWrapper');

months.forEach((m,i)=>{
const item=document.createElement('div');
item.className='slider-item'+(i===currentMonthIndex?' active':'');
item.textContent=m.replace('2026-','2026年')+'月';
item.onclick=()=>selectMonth(i);
monthWrapper.appendChild(item);
});

doctors.forEach((d,i)=>{
const item=document.createElement('div');
item.className='slider-item'+(i===currentDoctorIndex?' active':'');
item.textContent=d;
item.onclick=()=>selectDoctor(i);
doctorWrapper.appendChild(item);
});

updateSliderButtons();
}

function selectMonth(index){
currentMonthIndex=index;
document.querySelectorAll('#monthWrapper .slider-item').forEach((el,i)=>{
el.classList.toggle('active',i===index);
});
updateSliderButtons();
loadData();
}

function selectDoctor(index){
currentDoctorIndex=index;
document.querySelectorAll('#doctorWrapper .slider-item').forEach((el,i)=>{
el.classList.toggle('active',i===index);
});
updateSliderButtons();
loadData();
}

function slideMonth(direction){
const newIndex=currentMonthIndex+direction;
if(newIndex>=0&&newIndex<months.length){
selectMonth(newIndex);
}
}

function slideDoctor(direction){
const newIndex=currentDoctorIndex+direction;
if(newIndex>=0&&newIndex<doctors.length){
selectDoctor(newIndex);
}
}

function updateSliderButtons(){
document.getElementById('monthPrev').disabled=currentMonthIndex<=0;
document.getElementById('monthNext').disabled=currentMonthIndex>=months.length-1;
document.getElementById('doctorPrev').disabled=currentDoctorIndex<=0;
document.getElementById('doctorNext').disabled=currentDoctorIndex>=doctors.length-1;
}

async function loadData(){
const month=months[currentMonthIndex];
const doctor=doctors[currentDoctorIndex];
const loading=document.getElementById('loading');
const resultCard=document.getElementById('resultCard');
const salaryData=document.getElementById('salaryData');

loading.textContent='載入中...';
loading.style.display='block';
resultCard.style.display='none';

try{
const data=await sb.from('doctor_payroll').select('*').eq('month',month).eq('doctor_name',doctor).single();

if(data){
displaySalaryTable(data);
resultCard.style.display='block';
loading.style.display='none';
}else{
loading.innerHTML=`<div class="no-data"><h3>無資料</h3><p>${doctor} 在 ${month.replace('2026-','2026年')}月 尚無薪資資料</p></div>`;
resultCard.style.display='none';
}
}catch(err){
loading.innerHTML=`<div class="no-data"><h3>無資料</h3><p>${doctor} 在 ${month.replace('2026-','2026年')}月 尚無薪資資料</p></div>`;
resultCard.style.display='none';
}
}

function displaySalaryTable(data){
const html=`
<h2>${data.doctor_name} - ${data.month.replace('2026-','2026年')}月薪資明細</h2>
<table class="salary-table">
<tr><td><strong>月份</strong></td><td>${data.month.replace('2026-','2026年')}月</td></tr>
<tr><td><strong>診所</strong></td><td>${data.clinic_name||'115年巨蛋三井牙醫診所'}</td></tr>
<tr><td><strong>科別</strong></td><td>${data.department||'一般牙科'}</td></tr>
<tr><td><strong>醫師</strong></td><td>${data.doctor_name}</td></tr>
</table>

<h3 style="margin-top:20px">薪資結構</h3>
<table class="salary-table">
<tr><th>項目</th><th>比例</th></tr>
<tr><td>健保</td><td>${data.health_insurance_ratio||'0.9/0.55'}</td></tr>
<tr><td>一般自費</td><td>${data.general_selfpay_ratio||'0.55'}</td></tr>
<tr><td>特殊自費</td><td>${data.special_selfpay_ratio||'0.70'}</td></tr>
<tr><td>安全重建自費</td><td>${data.safety_reconstruction_ratio||'0.3'}</td></tr>
</table>

<h3 style="margin-top:20px">進項明細</h3>
<table class="salary-table">
<tr><th>項目</th><th>金額</th></tr>
<tr><td>健保</td><td>${data.health_insurance_income||'-'}</td></tr>
<tr><td>一般自費</td><td>${data.general_selfpay_income||'-'}</td></tr>
<tr><td>特殊自費</td><td>${data.special_selfpay_income||'-'}</td></tr>
<tr><td>安全重建自費</td><td>${data.safety_reconstruction_income||'-'}</td></tr>
<tr><td>SOP費用</td><td>${data.sop_fee||'-'}</td></tr>
</table>

<h3 style="margin-top:20px">減項明細</h3>
<table class="salary-table">
<tr><th>項目</th><th>金額</th></tr>
<tr><td>療程待扣款</td><td>${data.treatment_deduction||'-'}</td></tr>
<tr><td>印花稅票</td><td>${data.stamp_tax||'-'}</td></tr>
<tr><td>勞健保</td><td>${data.labor_health_insurance||'-'}</td></tr>
</table>

<table class="salary-table" style="margin-top:20px">
<tr class="highlight"><td><strong>應付薪資</strong></td><td><strong>${data.payable_salary||'-'}</strong></td></tr>
</table>

<h3 style="margin-top:20px">其他項目</h3>
<table class="salary-table">
<tr><th>項目</th><th>金額</th></tr>
<tr><td>餐費</td><td>${data.meal_fee||'-'}</td></tr>
<tr><td>其他待扣款</td><td>${data.other_deduction||'-'}</td></tr>
</table>

<table class="salary-table" style="margin-top:20px">
<tr class="final"><td><strong>實領薪資</strong></td><td><strong>${data.actual_salary||'-'}</strong></td></tr>
</table>

<p style="margin-top:16px;color:var(--mute);font-size:0.85rem">計算日期：${data.created_at?new Date(data.created_at).toLocaleDateString('zh-TW'):'-'}</p>
`;
document.getElementById('salaryData').innerHTML=html;
}

initSliders();
</script>
</body>
</html>
