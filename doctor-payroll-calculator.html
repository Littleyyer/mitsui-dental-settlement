<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>似錦牙醫｜醫師薪資查詢</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--text:#1d2b27;--mute:#5d6b66;--line:#cfd6d2;--acc:#4f9d69;--warn:#f59e0b;--bad:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--text:#e8efec;--mute:#9aa8a2;--line:#33403b}}
*{box-sizing:border-box}
html{font-size:112.5%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 8px;font-weight:600}
.sub{color:var(--mute);font-size:.85rem;margin:0 0 20px}
.card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.slider-section{margin-bottom:24px}
.slider-label{font-size:.9rem;color:var(--mute);margin-bottom:12px;display:block;font-weight:600}
.slider-container{position:relative;padding:8px 0}
.slider-wrapper{display:flex;gap:12px;overflow-x:auto;overflow-y:visible;padding:4px 0 12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.slider-wrapper::-webkit-scrollbar{height:6px}
.slider-wrapper::-webkit-scrollbar-track{background:transparent}
.slider-wrapper::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.slider-item{flex:0 0 auto;padding:12px 24px;background:var(--card);border:2px solid var(--line);border-radius:10px;cursor:pointer;user-select:none;transition:all 0.2s;white-space:nowrap;font-size:1rem;font-weight:500}
.slider-item:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.slider-item.active{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}

.salary-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:0.9rem}
.salary-table th,.salary-table td{padding:10px 12px;text-align:left;border:1px solid var(--line)}
.salary-table th{background:color-mix(in srgb,var(--acc) 15%,var(--card));font-weight:600;color:var(--text)}
.salary-table tr:nth-child(even){background:color-mix(in srgb,var(--bg) 50%,var(--card))}
.salary-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.salary-table tr.highlight{background:color-mix(in srgb,var(--warn) 20%,var(--card));font-weight:600}
.salary-table tr.final{background:color-mix(in srgb,var(--acc) 25%,var(--card));font-weight:700;color:var(--text)}

.no-data{text-align:center;padding:40px 20px;color:var(--mute);font-size:1.1rem}
.no-data-icon{font-size:3rem;margin-bottom:12px;opacity:0.3}
.loading{text-align:center;padding:40px;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>醫師薪資查詢</h1>
<p class="sub">選擇月份和醫師查看薪資明細</p>

<div class="slider-section">
<label class="slider-label">月份</label>
<div class="slider-container">
<div class="slider-wrapper" id="monthSlider"></div>
</div>
</div>

<div class="slider-section">
<label class="slider-label">醫師</label>
<div class="slider-container">
<div class="slider-wrapper" id="doctorSlider"></div>
</div>
</div>

<div class="card" id="dataCard">
<div class="loading">請選擇月份和醫師</div>
</div>
</main>

<script src="sb-lite.js"></script>
<script>
const doctors = ['郭維仁','余珮璇','林佑都','陳翊文','陳宜廷','程向正','李佶翰','何思穎','高方強','何昱璇','胡家瑄','李峻嘉','黃瀞儀','劉子綸','劉庭佑','秦御芬','陳厚錕'];
const months = ['2026-09','2026-10','2026-11'];
const monthLabels = {'2026-09':'2026年9月','2026-10':'2026年10月','2026-11':'2026年11月'};

let selectedMonth = '2026-11';
let selectedDoctor = '陳宜廷';

function renderMonthSlider(){
const slider = document.getElementById('monthSlider');
slider.innerHTML = months.map(m => 
`<div class="slider-item ${m === selectedMonth ? 'active' : ''}" onclick="selectMonth('${m}')">${monthLabels[m]}</div>`
).join('');
}

function renderDoctorSlider(){
const slider = document.getElementById('doctorSlider');
slider.innerHTML = doctors.map(d => 
`<div class="slider-item ${d === selectedDoctor ? 'active' : ''}" onclick="selectDoctor('${d}')">${d}</div>`
).join('');
}

function selectMonth(month){
selectedMonth = month;
renderMonthSlider();
loadData();
}

function selectDoctor(doctor){
selectedDoctor = doctor;
renderDoctorSlider();
loadData();
}

async function loadData(){
const card = document.getElementById('dataCard');
card.innerHTML = '<div class="loading">載入中...</div>';

try{
const {data,error} = await sb.from('doctor_payroll').select('*').eq('doctor_name',selectedDoctor).eq('month',selectedMonth).single();

if(error || !data){
card.innerHTML = `
<div class="no-data">
<div class="no-data-icon">📋</div>
<p><strong>${selectedDoctor}</strong> 在 <strong>${monthLabels[selectedMonth]}</strong> 無資料</p>
<p style="font-size:0.85rem;margin-top:8px;color:var(--mute);">請確認 Google Drive「似錦牙醫薪資/醫師/${selectedMonth.split('-')[0]}/${selectedMonth.split('-')[1]}月/醫師薪資明細」資料夾中是否有對應檔案</p>
</div>`;
return;
}

card.innerHTML = `
<h2 style="margin:0 0 16px;font-size:1.2rem;color:var(--acc)">${data.doctor_name} - ${monthLabels[data.month]}</h2>
<table class="salary-table">
<tr><th>項目</th><th class="num">金額</th></tr>
<tr><td colspan="2" style="background:var(--bg);font-weight:600">基本資料</td></tr>
<tr><td>診所</td><td class="num">${data.clinic_name || '－'}</td></tr>
<tr><td>科別</td><td class="num">${data.department || '－'}</td></tr>
<tr><td colspan="2" style="background:var(--bg);font-weight:600">健保</td></tr>
<tr><td>健保點數</td><td class="num">${data.health_insurance_points?.toLocaleString() || '－'}</td></tr>
<tr><td>申報件數</td><td class="num">${data.claim_count?.toLocaleString() || '－'}</td></tr>
<tr><td>健保進項 (0.9 × ${data.health_insurance_ratio || '－'})</td><td class="num">${data.health_insurance_income?.toLocaleString() || '－'}</td></tr>
<tr><td colspan="2" style="background:var(--bg);font-weight:600">一般自費</td></tr>
<tr><td>一般自費總額</td><td class="num">${data.general_selfpay_total?.toLocaleString() || '－'}</td></tr>
<tr><td>技工費總額</td><td class="num">${data.lab_fee_total?.toLocaleString() || '－'}</td></tr>
<tr><td>一般自費進項 (${data.general_selfpay_ratio || '－'})</td><td class="num">${data.general_selfpay_income?.toLocaleString() || '－'}</td></tr>
<tr><td colspan="2" style="background:var(--bg);font-weight:600">特殊自費</td></tr>
<tr><td>手術總額</td><td class="num">${data.surgery_total?.toLocaleString() || '－'}</td></tr>
<tr><td>特殊自費進項 (${data.special_selfpay_ratio || '－'})</td><td class="num">${data.special_selfpay_income?.toLocaleString() || '－'}</td></tr>
<tr><td colspan="2" style="background:var(--bg);font-weight:600">安全重建自費</td></tr>
<tr><td>安全重建總額</td><td class="num">${data.safety_rebuild_total?.toLocaleString() || '－'}</td></tr>
<tr><td>安全重建進項 (${data.safety_rebuild_ratio || '－'})</td><td class="num">${data.safety_rebuild_income?.toLocaleString() || '－'}</td></tr>
<tr><td colspan="2" style="background:var(--bg);font-weight:600">其他項目</td></tr>
<tr><td>印花稅票總額</td><td class="num">${data.stamp_tax_total?.toLocaleString() || '－'}</td></tr>
<tr><td>SOP費用</td><td class="num">${data.sop_fee?.toLocaleString() || '－'}</td></tr>
<tr><td>療程待扣款</td><td class="num">${data.treatment_deduction?.toLocaleString() || '－'}</td></tr>
<tr><td>印花稅票 (70%)</td><td class="num">${data.stamp_tax_doctor?.toLocaleString() || '－'}</td></tr>
<tr><td>勞健保</td><td class="num">${data.labor_health_insurance?.toLocaleString() || '－'}</td></tr>
<tr class="highlight"><td><strong>應付薪資</strong></td><td class="num"><strong>${data.payable_salary?.toLocaleString() || '－'}</strong></td></tr>
<tr><td>餐費</td><td class="num">${data.meal_allowance?.toLocaleString() || '－'}</td></tr>
<tr><td>其他待扣款</td><td class="num">${data.other_deductions?.toLocaleString() || '－'}</td></tr>
<tr class="final"><td><strong>實領薪資</strong></td><td class="num"><strong>${data.actual_salary?.toLocaleString() || '－'}</strong></td></tr>
</table>
<p style="margin-top:16px;font-size:0.85rem;color:var(--mute)">計算日期：${data.created_at ? new Date(data.created_at).toLocaleDateString('zh-TW') : '－'}</p>
`;
}catch(err){
card.innerHTML = `<div class="no-data"><div class="no-data-icon">⚠️</div><p>載入失敗：${err.message}</p></div>`;
}
}

renderMonthSlider();
renderDoctorSlider();
loadData();
</script>
</body>
</html>
