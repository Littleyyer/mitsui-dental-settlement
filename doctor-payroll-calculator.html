<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>似錦牙醫｜醫師薪資查詢</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--text:#1d2b27;--mute:#5d6b66;--line:#cfd6d2;--acc:#4f9d69;--warn:#f59e0b;--bad:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--text:#e8efec;--mute:#9aa8a2;--line:#33403b}}
*{box-sizing:border-box}
html{font-size:112.5%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 8px;font-weight:600}
.sub{color:var(--mute);font-size:.85rem;margin:0 0 20px}
.card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.filter-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-bar label{font-size:.9rem;color:var(--mute);margin-right:8px}
.filter-bar select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:1rem;min-width:180px}
.salary-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:0.9rem}
.salary-table th,.salary-table td{padding:10px 12px;text-align:left;border:1px solid var(--line)}
.salary-table th{background:var(--acc);color:#fff;font-weight:600}
.salary-table td{background:var(--card)}
.salary-table tr.section-header td{background:#e8f5e9;font-weight:600;color:var(--text)}
.salary-table tr.highlight td{background:#fff9c4;font-weight:600}
.salary-table tr.final td{background:#c8e6c9;font-weight:700;font-size:1.05rem}
.salary-table td.label{font-weight:500;width:40%}
.salary-table td.value{text-align:right;font-family:"SF Mono",Monaco,Consolas,monospace}
.no-data{text-align:center;padding:60px 20px;color:var(--mute);font-size:1.1rem}
.loading{text-align:center;padding:60px 20px;color:var(--mute)}
.info-box{background:#e3f2fd;border-left:4px solid #2196f3;padding:12px 16px;margin:16px 0;border-radius:4px;font-size:0.9rem}
</style>
<script src="sb-lite.js"></script>
</head>
<body>
<main>
<h1>🏥 醫師薪資查詢</h1>
<p class="sub">選擇醫師和月份查看薪資明細檔案內容</p>

<div class="card">
<div class="filter-bar">
<div>
<label>醫師：</label>
<select id="doctorSelect">
<option value="">請選擇醫師</option>
<option value="郭維仁">郭維仁</option>
<option value="余珮璇">余珮璇</option>
<option value="林佑都">林佑都</option>
<option value="陳翊文">陳翊文</option>
<option value="陳宜廷">陳宜廷</option>
<option value="程向正">程向正</option>
<option value="李佶翰">李佶翰</option>
<option value="何思穎">何思穎</option>
<option value="高方強">高方強</option>
<option value="何昱璇">何昱璇</option>
<option value="胡家瑄">胡家瑄</option>
<option value="李峻嘉">李峻嘉</option>
<option value="黃瀞儀">黃瀞儀</option>
<option value="劉子綸">劉子綸</option>
<option value="劉庭佑">劉庭佑</option>
<option value="秦御芬">秦御芬</option>
<option value="陳厚錕">陳厚錕</option>
</select>
</div>
<div>
<label>月份：</label>
<select id="monthSelect">
<option value="">請選擇月份</option>
<option value="2026-09">2026年9月</option>
<option value="2026-10">2026年10月</option>
<option value="2026-11">2026年11月</option>
</select>
</div>
</div>
</div>

<div id="salaryDisplay"></div>
</main>

<script type="module">
const doctorSelect = document.getElementById('doctorSelect');
const monthSelect = document.getElementById('monthSelect');
const salaryDisplay = document.getElementById('salaryDisplay');

// 監聽選擇變化
doctorSelect.addEventListener('change', loadSalaryData);
monthSelect.addEventListener('change', loadSalaryData);

async function loadSalaryData() {
  const doctor = doctorSelect.value;
  const month = monthSelect.value;
  
  if (!doctor || !month) {
    salaryDisplay.innerHTML = '';
    return;
  }

  salaryDisplay.innerHTML = '<div class="card loading">載入中...</div>';

  try {
    // 從 Supabase 查詢該醫師該月份的薪資明細
    const { data, error } = await sb
      .from('doctor_payroll')
      .select('*')
      .eq('doctor_name', doctor)
      .eq('month', month)
      .single();

    if (error) {
      if (error.code === 'PGRST116') {
        // 沒有找到資料
        salaryDisplay.innerHTML = `
          <div class="card no-data">
            <p>無資料</p>
            <div class="info-box">
              <strong>提示：</strong>該醫師在 ${month.replace('2026-', '2026年')} 月的薪資明細尚未建立。<br>
              薪資明細檔案位於 Google Drive：<br>
              <code>似錦牙醫薪資/醫師/2026/${month.split('-')[1]}月/醫師薪資明細/salary_detail_${doctor}_${month}.xlsx</code>
            </div>
          </div>
        `;
        return;
      }
      throw error;
    }

    // 顯示薪資明細
    displaySalaryDetail(data);
    
  } catch (error) {
    console.error('Error:', error);
    salaryDisplay.innerHTML = `
      <div class="card no-data">
        <p>載入失敗</p>
        <p style="font-size:0.85rem;color:var(--warn);margin-top:12px;">
          錯誤訊息：${error.message}
        </p>
      </div>
    `;
  }
}

function displaySalaryDetail(data) {
  const monthText = data.month.replace('2026-', '2026年') + '月';
  
  salaryDisplay.innerHTML = `
    <div class="card">
      <h2>📋 ${data.doctor_name} - ${monthText} 薪資明細</h2>
      <table class="salary-table">
        <tr><td class="label">月份</td><td class="value">${data.month_display || monthText}</td></tr>
        <tr><td class="label">診所名稱</td><td class="value">${data.clinic_name || '115年巨蛋三井牙醫診所'}</td></tr>
        <tr><td class="label">科別</td><td class="value">${data.department || '一般牙科'}</td></tr>
        <tr><td class="label">醫師姓名</td><td class="value">${data.doctor_name}</td></tr>
        
        <tr class="section-header"><td colspan="2">薪資結構</td></tr>
        <tr><td class="label">健保 0.9 / ${data.insurance_rate || '-'}</td><td class="value"></td></tr>
        <tr><td class="label">一般自費 ${data.general_rate || '-'}</td><td class="value"></td></tr>
        <tr><td class="label">特殊自費（手術） ${data.special_rate || '-'}</td><td class="value"></td></tr>
        <tr><td class="label">安全重建自費 ${data.rebuild_rate || '-'}</td><td class="value"></td></tr>
        
        <tr class="section-header"><td colspan="2">其他項目</td></tr>
        <tr><td class="label">印花稅票總額</td><td class="value">${formatCurrency(data.stamp_tax_total)}</td></tr>
        
        <tr class="section-header"><td colspan="2">進項</td></tr>
        <tr><td class="label">健保（點數 × 0.9 × 拆分比例）</td><td class="value">${formatCurrency(data.insurance_income)}</td></tr>
        <tr><td class="label">一般自費（總額 - 技工費）× 拆分比例</td><td class="value">${formatCurrency(data.general_income)}</td></tr>
        <tr><td class="label">特殊自費（手術總額）× 拆分比例</td><td class="value">${formatCurrency(data.special_income)}</td></tr>
        <tr><td class="label">安全重建自費（總額）× 拆分比例</td><td class="value">${formatCurrency(data.rebuild_income)}</td></tr>
        <tr><td class="label">SOP費用</td><td class="value">${formatCurrency(data.sop_fee)}</td></tr>
        
        <tr class="section-header"><td colspan="2">減項</td></tr>
        <tr><td class="label">療程待扣款</td><td class="value">${formatCurrency(data.treatment_deduction)}</td></tr>
        <tr><td class="label">印花稅票（醫師負擔70%）</td><td class="value">${formatCurrency(data.stamp_tax_doctor)}</td></tr>
        <tr><td class="label">勞健保</td><td class="value">${formatCurrency(data.labor_insurance)}</td></tr>
        
        <tr class="highlight"><td class="label">應付薪資</td><td class="value">${formatCurrency(data.payable_salary)}</td></tr>
        
        <tr class="section-header"><td colspan="2">其他進項/減項</td></tr>
        <tr><td class="label">餐費</td><td class="value">${formatCurrency(data.meal_fee)}</td></tr>
        <tr><td class="label">其他待扣款</td><td class="value">${formatCurrency(data.other_deduction)}</td></tr>
        
        <tr class="final"><td class="label">實領薪資</td><td class="value">${formatCurrency(data.actual_salary)}</td></tr>
      </table>
      
      ${data.notes ? `<div class="info-box" style="margin-top:16px;">
        <strong>備註：</strong>${data.notes}
      </div>` : ''}
    </div>
  `;
}

function formatCurrency(value) {
  if (value === null || value === undefined || value === '') return '-';
  return new Intl.NumberFormat('zh-TW', {
    style: 'decimal',
    minimumFractionDigits: 0,
    maximumFractionDigits: 0
  }).format(value);
}
</script>
</body>
</html>
